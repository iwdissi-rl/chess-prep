[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-prep"
version = "0.1.0"
description = "Scout a chess opponent from their public Chess.com or Lichess games, make a cheatsheet, and practise against a bot that plays like them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rye Liu" }]
requires-python = ">=3.10"
keywords = ["chess", "stockfish", "lichess", "chess.com", "opening preparation", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "chess>=1.10",
    "requests>=2.31",
    "reportlab>=4.1",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
dev = ["pytest>=8", "ruff>=0.6", "flask>=3.0"]

[project.scripts]
chessprep = "chess_prep.cli:main"

[project.urls]
Homepage = "https://github.com/iwdissi-rl/chess-prep"
Issues = "https://github.com/iwdissi-rl/chess-prep/issues"

[tool.setuptools.packages.find]
include = ["chess_prep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"chess_prep/web.py" = ["E501"]  # embedded HTML/JavaScript page
